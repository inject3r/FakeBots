# =============================================================================
#  FakeBots - release pipeline
#
#  Push a version tag (for example v3.2.1), or push a release-preparation commit to master
#  whose exact message is "chore(release): vX.Y.Z". Both paths audit and build the 32-bit
#  Linux/Windows plugins, package them, and publish the GitHub release.
#
#  A release-preparation commit creates the matching version tag at that commit when the
#  release is published. Ordinary master commits do not publish. "Run workflow"
#  (workflow_dispatch) remains a build-only path and stores binaries as Actions artifacts.
#
#  Publishing uses the job-scoped GITHUB_TOKEN with contents: write; no personal token secret
#  is required.
# =============================================================================
name: Release

on:
  push:
    branches:
      - master
    tags:
      - "*"
    paths:
      - "src/core/Common.h"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Build/audit jobs are read-only; only the publish job receives contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  audit:
    name: Source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No NPC code paths, no forbidden APIs
        run: python3 tools/source_audit.py

      - name: Tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          plugin_version="$(grep -oP 'FAKEBOTS_VERSION_STRING\s+"\K[^"]+' src/core/Common.h)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "tag: ${GITHUB_REF_NAME}   plugin reports: ${plugin_version}"
          if [ "${plugin_version}" != "${tag_version}" ]; then
            echo "::error title=Tag and plugin version differ::The tag is ${GITHUB_REF_NAME} but src/core/Common.h says ${plugin_version}."
            exit 1
          fi

      - name: Release commit matches the plugin version
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'chore(release): v')
        run: |
          plugin_version="$(grep -oP 'FAKEBOTS_VERSION_STRING\s+"\K[^"]+' src/core/Common.h)"
          release_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
          expected_message="chore(release): v${plugin_version}"
          echo "release commit: ${release_message}"
          if [ "${release_message}" != "${expected_message}" ]; then
            echo "::error title=Release message and version differ::Expected '${expected_message}'."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  build-linux:
    name: Build (Linux x86)
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake gcc-multilib g++-multilib

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFAKEBOTS_BUILD_PROBE=ON

      - name: Build
        run: cmake --build build --parallel --target FakeBots

      - name: Check the result
        run: |
          file build/FakeBots.so
          file build/FakeBots.so | grep -q 'ELF 32-bit LSB shared object, Intel 80386'
          echo "--- shared libraries the plugin needs:"
          readelf -d build/FakeBots.so | grep NEEDED || true
          echo "--- exported plugin entry points:"
          nm -D --defined-only build/FakeBots.so | grep -E ' (Supports|Load|Unload|AmxLoad|AmxUnload|ProcessTick)$'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86
          path: build/FakeBots.so
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-windows:
    name: Build (Windows x86)
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the MinGW-w64 (i686) cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-mingw-w64-i686

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-i686.cmake -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Check the result (self-contained 32-bit DLL)
        run: |
          file build/FakeBots.dll
          file build/FakeBots.dll | grep -q 'PE32 executable (DLL)'
          imports="$(i686-w64-mingw32-objdump -p build/FakeBots.dll | sed -n 's/^.*DLL Name: //p' | sort -u)"
          echo "--- DLLs the plugin imports:"
          echo "${imports}"
          # Only what every Windows has. A MinGW runtime DLL here would make the plugin fail to
          # load on a server machine that does not ship it.
          unexpected="$(echo "${imports}" | grep -viE '^(kernel32|ws2_32|msvcrt|user32|advapi32)\.dll$' || true)"
          if [ -n "${unexpected}" ]; then
            echo "::error title=Unexpected DLL dependency::${unexpected}"
            exit 1
          fi
          echo "--- exported plugin entry points:"
          i686-w64-mingw32-objdump -p build/FakeBots.dll | grep -E '\b(Supports|Load|Unload|AmxLoad|AmxUnload|ProcessTick)\b'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86
          path: build/FakeBots.dll
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'chore(release): v'))
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine and validate release tag
        shell: bash
        run: |
          plugin_version="$(grep -oP 'FAKEBOTS_VERSION_STRING\s+"\K[^"]+' src/core/Common.h)"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            tag_version="${TAG#v}"
            if [[ "${tag_version}" != "${plugin_version}" ]]; then
              echo "::error title=Tag and plugin version differ::${TAG} does not match ${plugin_version}."
              exit 1
            fi
          else
            TAG="v${plugin_version}"
            release_message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH")"
            expected_message="chore(release): ${TAG}"
            if [[ "${release_message}" != "${expected_message}" ]]; then
              echo "::error title=Invalid release commit::Expected '${expected_message}'."
              exit 1
            fi
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Publishing FakeBots ${TAG}"

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86
          path: artifacts/linux-x86

      - uses: actions/download-artifact@v4
        with:
          name: windows-x86
          path: artifacts/windows-x86

      - name: Package the release files
        run: |
          python3 tools/package_release.py --tag "${TAG}" \
            --linux   artifacts/linux-x86/FakeBots.so \
            --windows artifacts/windows-x86/FakeBots.dll \
            --out dist
          python3 tools/release_notes.py --tag "${TAG}" > notes.md
          echo "--- release files:"
          ls -la dist
          echo "--- checksums:"
          cat dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Create (or update) the GitHub release
        run: |
          set -euo pipefail
          # "v1.2.3-rc1", "1.0.0-beta" ... are pre-releases
          prerelease=false
          case "${TAG}" in *-*) prerelease=true ;; esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists - replacing its files and text."
            gh release upload "${TAG}" dist/* --clobber
            gh release edit "${TAG}" --title "FakeBots ${TAG}" --notes-file notes.md --prerelease="${prerelease}"
          else
            gh release create "${TAG}" dist/* \
              --title "FakeBots ${TAG}" \
              --notes-file notes.md \
              --prerelease="${prerelease}" \
              --target "${GITHUB_SHA}"
          fi
          gh release view "${TAG}" --json url,assets --jq '"Released: \(.url)\n" + ([.assets[].name] | join("\n"))'
