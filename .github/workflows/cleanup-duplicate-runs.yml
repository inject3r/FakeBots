name: Maintenance - duplicate Actions cleanup

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/cleanup-duplicate-runs.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Remove superseded release runs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete superseded and failed cleanup runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in \
            44808278829 \
            44808269144 \
            44808019123 \
            44807771742 \
            44807759383 \
            44811269013
          do
            gh api --silent --method DELETE "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "Deleted workflow run ${run_id}"
          done
